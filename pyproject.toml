[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-omop-pipeline"
version = "0.1.0"
description = "Synthetic FHIR R4 ingestion and OMOP CDM 5.4 transformation demo"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.2.6"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "dbt-postgres==1.9.0"]

[project.scripts]
fhir-omop = "fhir_omop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

